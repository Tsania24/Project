<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 8 A-Frame Interactive Scene</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script>
        AFRAME.registerComponent('texture-loader', {
            schema: {
                src: {},
                material_tex: {},
                mesh: {},
                texture: {},
                normal: {type: "boolean"},
                normal_src: {},
                wrap: {type: "boolean", default: false},
                repeat: {type: "boolean", default: false}
            },
            init: function () {
                console.log('initialized');
            },
            update: function () {
                this.data.texture = new THREE.TextureLoader().load(this.data.src);

                this.data.texture.anisotropy = 16;
                this.data.texture.minFilter = THREE.NearestFilter;
                this.data.texture.maxFilter = THREE.NearestFilter;
                this.data.material_tex = new THREE.MeshLambertMaterial( {map: this.data.texture} );
                const el = this.el;
                this.data.mesh = el.getObject3D('mesh');
                this.data.mesh.material = this.data.material_tex;

                if (this.data.normal == true) {
                    console.log('normal true');
                    this.data.normal_map = new THREE.TextureLoader().load(this.data.normal_src);
                    this.data.mesh.material.normalMap = this.data.normal_map;
                    this.data.mesh.receiveShadow = true;
                }
                if (this.data.wrap === true && this.data.repeat === true) {
                    this.data.texture.wrapS = this.data.texture.wrapT = THREE.RepeatWrapping;
                    this.data.texture.repeat.set(25, 25);   
                }
            }
        });

        AFRAME.registerComponent('movable', {
            init: function () {
                const el = this.el;
                el.addEventListener('move-left', () => el.object3D.position.x -= 0.5);
                el.addEventListener('move-right', () => el.object3D.position.x += 0.5);
                el.addEventListener('move-up', () => el.object3D.position.y += 0.5);
                el.addEventListener('move-down', () => el.object3D.position.y -= 0.5);
            }
        });
    </script>
</head>
<body>
    <a-scene fog="type: exponential; density: 0.1; color: #cce0ff" grab>
        <a-entity id="dir-light" light="type: directional; color: #dfebff; intensity: 1" position="50 200 100"></a-entity>
        <a-entity light="type: ambient; color: #666666"></a-entity>
        
        <a-plane id="ground" 
                 texture-loader="src: texture/grass.jpg; normal: true; wrap: true; repeat: true"
                 height="50" width="50" 
                 rotation="-90 0 0"
        ></a-plane>

        <!-- Kubus yang dapat digerakkan -->
        <a-box id="movable-box" 
               texture-loader="src: texture/Brick.jpg"
               position="0 0.5 -3"
               depth="1" height="1" width="1"
               movable
        ></a-box>

        <a-sphere position="-1 0.5 -2" radius="0.2" color="#FF5733" dynamic-body grabbable></a-sphere>
        <a-sphere position="0 0.5 -2" radius="0.2" color="#33FF57" dynamic-body grabbable></a-sphere>
        <a-sphere position="1 0.5 -2" radius="0.2" color="#3357FF" dynamic-body grabbable></a-sphere>
        
        <a-sky color="#87CEEB"></a-sky>
    </a-scene>

    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center;">
        <button onclick="document.querySelector('#movable-box').emit('move-left')">Left</button>
        <button onclick="document.querySelector('#movable-box').emit('move-up')">Up</button>
        <button onclick="document.querySelector('#movable-box').emit('move-down')">Down</button>
        <button onclick="document.querySelector('#movable-box').emit('move-right')">Right</button>
    </div>
</body>
</html>
